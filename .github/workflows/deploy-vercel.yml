name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - gh-pages

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not set. Skipping deployment.";
            exit 0;
          fi
          # Use the CLI to deploy the repository root as a static site.
          # If you want to target a specific project/org, set the VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets.
          vercel --prod --token "$VERCEL_TOKEN" --confirm
