<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loading — Dhanith Sri</title>
  <style>
    :root{
      --bg-main:#070B18;
      --bg-tertiary:#0a0520;
      --purple-mid:#9B59D0;
      --purple-shimmer:#E2C4FF;
      --text-primary:#F0E8FF;
    }
    html,body{ height:100%; margin:0; }
    body{ background:
        linear-gradient(180deg,var(--bg-main) 0%, var(--bg-tertiary) 100%);
      color:var(--text-primary); font-family:Inter,system-ui,Segoe UI,Roboto,Arial; display:flex; align-items:center; justify-content:center }
    .loader-viewport{ width:100%; height:100%; display:grid; place-items:center; position:relative; overflow:hidden }
    .brand-wrap{ width:min(90vw,1100px); display:grid; place-items:center; }

    .brand-text{ position:relative; font-size:clamp(64px,18vw,180px); line-height:0.9; letter-spacing:0.06em; font-weight:800; text-align:center; margin:0; transform-origin:center; }
    .brand-text .dhanith{ display:inline-block; color:var(--purple-shimmer); text-shadow:0 0 18px rgba(226,196,255,0.26), 0 0 46px rgba(155,89,208,0.16) }
    .brand-text .sri{ display:inline-block; color:var(--text-primary); margin-left:0.12em; }
    .brand-text::after{
      content:'DHANITH SRI';
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:transparent;
      background:linear-gradient(110deg, rgba(240,232,255,0) 0%, rgba(240,232,255,0) 36%, rgba(226,196,255,0.92) 50%, rgba(240,232,255,0) 64%, rgba(240,232,255,0) 100%);
      background-size:240% 100%;
      background-position:0% 50%;
      -webkit-background-clip:text;
      background-clip:text;
      pointer-events:none;
      opacity:0.88;
      animation: shimmerSweep 8s linear infinite;
    }
    .brand-sub{ margin-top:18px; font-size:12px; letter-spacing:0.42em; text-transform:uppercase; color:rgba(240,232,255,0.42) }

    /* Subtle fade-out helper class */
    .fade-out{ animation: fadeOut 420ms ease forwards }
    @keyframes fadeOut{ to { opacity:0; transform:translateY(-8px) } }

    .brand-animate{ animation: popIn 1100ms cubic-bezier(.2,.9,.2,1) both, glowPulse 2.8s ease-in-out 1100ms infinite, breathe 4.8s ease-in-out 1.3s infinite }
    @keyframes popIn{
      0%{ opacity:0; transform:scale(0.82) translateY(18px); filter:blur(10px) }
      100%{ opacity:1; transform:scale(1) translateY(0); filter:blur(0) }
    }
    @keyframes shimmerSweep{
      0%{ background-position:-140% 50% }
      100%{ background-position:140% 50% }
    }
    @keyframes glowPulse{
      0%,100%{ text-shadow:0 0 18px rgba(226,196,255,0.22), 0 0 44px rgba(155,89,208,0.14) }
      50%{ text-shadow:0 0 26px rgba(226,196,255,0.36), 0 0 62px rgba(155,89,208,0.24) }
    }
    @keyframes breathe{
      0%,100%{ transform:scale(1) }
      50%{ transform:scale(1.02) }
    }

    /* Reduce motion fallback */
    @media (prefers-reduced-motion: reduce){
      .brand-animate{ animation:none }
      .brand-text::after{ animation:none }
    }
  </style>
</head>
<body>
  <main class="loader-viewport" id="loader">
    <div class="brand-wrap" role="img" aria-label="Dhanith Sri loading animation">
      <h1 class="brand-text brand-animate" id="brandText">
        <span class="dhanith">DHANITH</span>
        <span class="sri">SRI</span>
      </h1>
      <div class="brand-sub brand-animate" aria-hidden="true">loading</div>
    </div>
  </main>

  <script>
    (function(){
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const loader = document.getElementById('loader');

      function endAndGo(){
        loader.classList.add('fade-out');
        setTimeout(()=> window.location.replace('index.html'), 420);
      }

      if(prefersReduced){
        setTimeout(endAndGo, 250);
        return;
      }

      setTimeout(endAndGo, 1800);
    })();
  </script>
</body>
</html>
