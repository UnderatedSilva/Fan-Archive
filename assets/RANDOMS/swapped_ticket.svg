<svg width="600" height="230" viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <!-- Main background gradient - purple/teal matching Swapped movie palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2d1060;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0e3d5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2a3d;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect for magical roots/vines -->
    <radialGradient id="glowPurple" cx="50%" cy="80%" r="60%">
      <stop offset="0%" style="stop-color:#c04aff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#c04aff;stop-opacity:0" />
    </radialGradient>

    <!-- Stub gradient -->
    <linearGradient id="stubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2fff" />
      <stop offset="100%" style="stop-color:#3a0080" />
    </linearGradient>

    <!-- Shine overlay -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.07" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>

    <!-- Clip for main ticket body -->
    <clipPath id="ticketClip">
      <rect x="0" y="0" width="510" height="230" rx="14" ry="14"/>
    </clipPath>

    <!-- Clip for stub -->
    <clipPath id="stubClip">
      <rect x="518" y="0" width="82" height="230" rx="14" ry="14"/>
    </clipPath>

    <!-- Decorative vine filter -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── MAIN TICKET BODY ── -->
  <g clip-path="url(#ticketClip)">
    <!-- Base background -->
    <rect x="0" y="0" width="510" height="230" fill="url(#bgGrad)"/>

    <!-- Magical purple glow from bottom -->
    <ellipse cx="200" cy="230" rx="200" ry="100" fill="url(#glowPurple)"/>

    <!-- Decorative glowing vine roots (bottom-left area, matching movie poster) -->
    <!-- Root strands -->
    <g filter="url(#purpleGlow)" opacity="0.85">
      <path d="M 0 230 Q 30 180 80 160 Q 120 145 100 110" stroke="#c04aff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 0 230 Q 60 200 110 190 Q 150 182 130 150 Q 115 125 140 100" stroke="#a030ff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 30 230 Q 70 210 90 195 Q 110 178 95 155" stroke="#d060ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 0 200 Q 50 185 70 170 Q 90 155 75 130" stroke="#b040ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 20 230 Q 40 215 55 205 Q 80 190 65 170 Q 50 150 70 130" stroke="#9020ee" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Tendrils branching off -->
      <path d="M 80 160 Q 100 150 115 155" stroke="#c04aff" stroke-width="1.2" fill="none"/>
      <path d="M 95 155 Q 105 140 120 142" stroke="#a030ff" stroke-width="1" fill="none"/>
      <path d="M 130 150 Q 145 138 160 143" stroke="#c04aff" stroke-width="1" fill="none"/>
      <path d="M 65 170 Q 80 160 95 163" stroke="#d060ff" stroke-width="1" fill="none"/>
    </g>

    <!-- Glowing heart/magic orb center (subtle, bottom-left) -->
    <ellipse cx="115" cy="190" rx="14" ry="14" fill="#c04aff" opacity="0.18"/>
    <ellipse cx="115" cy="190" rx="7" ry="7" fill="#e080ff" opacity="0.35"/>
    <ellipse cx="115" cy="190" rx="3" ry="3" fill="#ffffff" opacity="0.6"/>

    <!-- Soft forest/background hint (top right) -->
    <ellipse cx="400" cy="60" rx="120" ry="70" fill="#1a4a2a" opacity="0.18"/>
    <ellipse cx="460" cy="40" rx="70" ry="50" fill="#2a6040" opacity="0.12"/>

    <!-- Shine overlay -->
    <rect x="0" y="0" width="510" height="230" fill="url(#shineGrad)"/>

    <!-- Subtle film grain / texture dots -->
    <rect x="0" y="0" width="510" height="230" fill="none" opacity="0.04"
          style="background-image: url('data:image/svg+xml,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&lt;/svg&gt;')"/>

    <!-- Top label -->
    <text x="24" y="28" font-family="'Trebuchet MS', sans-serif" font-size="8.5" fill="#c8a8ff" letter-spacing="2.5" opacity="0.85">STUDENTS WELLBEING ASSOCIATION PRESENTS</text>

    <!-- MOVIE TITLE -->
    <text x="24" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#ffffff"
          letter-spacing="3" style="text-shadow: 0 0 20px #c04aff;">SWAPPED</text>

    <!-- Subtitle info line -->
    <text x="26" y="95" font-family="'Trebuchet MS', sans-serif" font-size="9.5" fill="#d4b8ff" letter-spacing="2" opacity="0.9">2026  ·  ANIMATION / FAMILY  ·  1H 45M</text>

    <!-- Decorative separator line -->
    <line x1="24" y1="106" x2="490" y2="106" stroke="#c04aff" stroke-width="0.5" opacity="0.4"/>

    <!-- Bottom section -->
    <!-- Seat info -->
    <text x="24" y="160" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" fill="#ffffff" letter-spacing="2">B2  L207 (FOB)</text>

    <!-- Time -->
    <text x="24" y="200" font-family="'Courier New', Courier, monospace" font-size="21" font-weight="bold" fill="#ffffff" letter-spacing="1.5">1.00 PM ONWARDS</text>

    <!-- Bottom decorative line -->
    <line x1="24" y1="215" x2="490" y2="215" stroke="#c04aff" stroke-width="0.5" opacity="0.3"/>

    <!-- Perforated edge (dashes between ticket and stub) -->
    <line x1="510" y1="18" x2="510" y2="212" stroke="#4a2080" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>

    <!-- Cutout notches top and bottom -->
    <circle cx="510" cy="0" r="12" fill="#1a0533"/>
    <circle cx="510" cy="230" r="12" fill="#1a0533"/>
  </g>

  <!-- ── TICKET STUB ── -->
  <g clip-path="url(#stubClip)">
    <rect x="518" y="0" width="82" height="230" fill="url(#stubGrad)" rx="14" ry="14"/>

    <!-- Shine on stub -->
    <rect x="518" y="0" width="82" height="115" fill="#ffffff" opacity="0.06" rx="14" ry="14"/>

    <!-- YEAR - rotated -->
    <text x="559" y="55" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#ffffff"
          letter-spacing="3" text-anchor="middle" transform="rotate(90, 559, 55)">2026</text>

    <!-- Divider -->
    <line x1="530" y1="90" x2="590" y2="90" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>

    <!-- MONTH - rotated -->
    <text x="559" y="130" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#ffffff"
          letter-spacing="3" text-anchor="middle" transform="rotate(90, 559, 130)">MAY</text>

    <!-- Divider -->
    <line x1="530" y1="160" x2="590" y2="160" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>

    <!-- DATE -->
    <text x="559" y="195" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff"
          text-anchor="middle">29</text>

    <!-- Price -->
    <text x="559" y="219" font-family="'Trebuchet MS', sans-serif" font-size="8.5" fill="#e0c8ff"
          text-anchor="middle" letter-spacing="1">Rs. 100.00</text>
  </g>

  <!-- ── OUTER BORDER ── -->
  <rect x="1" y="1" width="508" height="228" rx="13" ry="13" fill="none" stroke="#c04aff" stroke-width="0.8" opacity="0.5"/>
  <rect x="519" y="1" width="80" height="228" rx="13" ry="13" fill="none" stroke="#9050cc" stroke-width="0.8" opacity="0.4"/>
</svg>
